name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Discover .NET runtime folder
        id: runtimedir
        run: |
          RUNTIME_DIR=$(find "${DOTNET_ROOT:-$HOME/.dotnet}/shared/Microsoft.NETCore.App" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "path=$RUNTIME_DIR" >> "$GITHUB_OUTPUT"
          echo "found: $RUNTIME_DIR"

      - name: Install Capacitor
        run: |
          test -f package.json || npm init -y
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/ios

      - name: Generate iOS project (ignore first pod failure)
        run: |
          npx cap add ios || true

      - name: Raise iOS deployment target
        run: |
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            ios/App/App.xcodeproj/project.pbxproj

      - name: Sync Capacitor and run pod install
        run: |
          npx cap sync ios

      - name: Build SimHost NativeAOT static library for iOS
        run: |
          dotnet publish server/sim/SimHost.csproj \
            -r ios-arm64 \
            -c Release \
            -p:SimHostRuntimeDir="${{ steps.runtimedir.outputs.path }}"

          echo "=== publish output ==="
          ls -la server/sim/bin/Release/net10.0/ios-arm64/publish/

          mkdir -p sim-libs
          cp server/sim/bin/Release/net10.0/ios-arm64/publish/*.a sim-libs/

          echo "=== sim-libs ==="
          ls -la sim-libs/

      - name: Add NativeSimHost.swift
        run: |
          cat > ios/App/App/NativeSimHost.swift <<'SWIFT'
          import Foundation

          @_silgen_name("sfoth_init")
          func sfoth_init() -> Int32

          @_silgen_name("sfoth_step_sim")
          func sfoth_step_sim() -> Int32

          @_silgen_name("sfoth_get_snapshot_json")
          func sfoth_get_snapshot_json() -> UnsafeMutablePointer<CChar>?

          final class NativeSimHost {
              static let shared = NativeSimHost()

              private var initialized = false

              func start() -> Bool {
                  if initialized { return true }
                  initialized = sfoth_init() == 0
                  return initialized
              }

              func step() -> Bool {
                  if !initialized { _ = start() }
                  return sfoth_step_sim() == 0
              }

              func snapshotJson() -> String {
                  guard let ptr = sfoth_get_snapshot_json() else { return "{}" }
                  return String(cString: ptr)
              }
          }
          SWIFT

      - name: Add EmbeddedSignalingServer.swift
        run: |
          cat > ios/App/App/EmbeddedSignalingServer.swift <<'SWIFT'
          import Foundation
          import Network

          final class EmbeddedSignalingServer {
              static let shared = EmbeddedSignalingServer()

              private var listener: NWListener?
              private let queue = DispatchQueue(label: "sfoth.signaling")
              private var rooms: [String: [String: [[String: Any]]]] = [:]
              private var simTimer: DispatchSourceTimer?

              func start(port: UInt16 = 8081) throws {
                  if listener != nil { return }

                  _ = NativeSimHost.shared.start()
                  startSimTimer()

                  let params = NWParameters.tcp
                  params.allowLocalEndpointReuse = true

                  let l = try NWListener(using: params, on: NWEndpoint.Port(rawValue: port)!)
                  l.newConnectionHandler = { [weak self] conn in
                      self?.handle(conn)
                  }
                  l.start(queue: queue)
                  listener = l
              }

              private func startSimTimer() {
                  let timer = DispatchSource.makeTimerSource(queue: queue)
                  timer.schedule(deadline: .now(), repeating: .milliseconds(16))
                  timer.setEventHandler {
                      _ = NativeSimHost.shared.step()
                  }
                  timer.resume()
                  simTimer = timer
              }

              private struct Request {
                  let method: String
                  let path: String
                  let query: [String: String]
                  let body: Data
              }

              private func handle(_ conn: NWConnection) {
                  conn.start(queue: queue)
                  receive(conn, buffer: Data())
              }

              private func receive(_ conn: NWConnection, buffer: Data) {
                  conn.receive(minimumIncompleteLength: 1, maximumLength: 65536) { [weak self] data, _, isComplete, error in
                      guard let self = self else { return }

                      var buf = buffer
                      if let data = data { buf.append(data) }

                      if let req = self.parse(buf) {
                          self.route(req, conn)
                          return
                      }

                      if isComplete || error != nil {
                          conn.cancel()
                          return
                      }

                      self.receive(conn, buffer: buf)
                  }
              }

              private func parse(_ data: Data) -> Request? {
                  guard let sep = data.range(of: Data("\r\n\r\n".utf8)) else { return nil }

                  let head = data.subdata(in: 0..<sep.lowerBound)
                  let bodyStart = sep.upperBound

                  guard let headStr = String(data: head, encoding: .utf8) else { return nil }
                  let lines = headStr.components(separatedBy: "\r\n")
                  guard let first = lines.first else { return nil }

                  let parts = first.split(separator: " ")
                  guard parts.count >= 2 else { return nil }

                  let method = String(parts[0])
                  let fullPath = String(parts[1])

                  var path = fullPath
                  var query: [String: String] = [:]

                  if let qIndex = fullPath.firstIndex(of: "?") {
                      path = String(fullPath[..<qIndex])
                      let qs = String(fullPath[fullPath.index(after: qIndex)...])
                      for pair in qs.split(separator: "&") {
                          let kv = pair.split(separator: "=", maxSplits: 1).map(String.init)
                          if kv.count == 2 {
                              query[kv[0]] = kv[1].removingPercentEncoding ?? kv[1]
                          }
                      }
                  }

                  var contentLength = 0
                  for line in lines.dropFirst() {
                      let lower = line.lowercased()
                      if lower.hasPrefix("content-length:") {
                          let value = line.split(separator: ":", maxSplits: 1).dropFirst().joined()
                          contentLength = Int(value.trimmingCharacters(in: .whitespaces)) ?? 0
                      }
                  }

                  guard data.count >= bodyStart + contentLength else { return nil }
                  let body = data.subdata(in: bodyStart..<(bodyStart + contentLength))

                  return Request(method: method, path: path, query: query, body: body)
              }

              private func route(_ req: Request, _ conn: NWConnection) {
                  if req.method == "OPTIONS" {
                      respondData(conn, 204, Data())
                      return
                  }

                  if req.method == "POST" && req.path == "/create" {
                      let room = String(UUID().uuidString.prefix(6)).lowercased()
                      rooms[room] = ["host": [], "guest": []]
                      respond(conn, 200, "{\"room\":\"\(room)\"}")
                      return
                  }

                  if req.method == "POST" && req.path == "/send" {
                      guard let room = req.query["room"],
                            let to = req.query["to"],
                            rooms[room] != nil else {
                          respond(conn, 404, "{\"error\":\"no room\"}")
                          return
                      }

                      let obj = (try? JSONSerialization.jsonObject(with: req.body)) as? [String: Any] ?? [:]
                      var bucket = rooms[room]!
                      var arr = bucket[to] ?? []
                      arr.append(obj)
                      bucket[to] = arr
                      rooms[room] = bucket

                      respond(conn, 200, "{\"ok\":true}")
                      return
                  }

                  if req.method == "GET" && req.path == "/poll" {
                      guard let room = req.query["room"],
                            let role = req.query["role"],
                            var bucket = rooms[room] else {
                          respond(conn, 404, "{\"error\":\"no room\"}")
                          return
                      }

                      let msgs = bucket[role] ?? []
                      bucket[role] = []
                      rooms[room] = bucket

                      let data = (try? JSONSerialization.data(withJSONObject: msgs)) ?? Data("[]".utf8)
                      respondData(conn, 200, data)
                      return
                  }

                  if req.method == "POST" && req.path == "/sim/step" {
                      _ = NativeSimHost.shared.step()
                      respond(conn, 200, "{\"ok\":true}")
                      return
                  }

                  if req.method == "GET" && req.path == "/sim/snapshot" {
                      let json = NativeSimHost.shared.snapshotJson()
                      respondData(conn, 200, Data(json.utf8))
                      return
                  }

                  respond(conn, 404, "{\"error\":\"not found\"}")
              }

              private func respond(_ conn: NWConnection, _ code: Int, _ body: String) {
                  respondData(conn, code, Data(body.utf8))
              }

              private func respondData(_ conn: NWConnection, _ code: Int, _ body: Data) {
                  let status: String
                  switch code {
                  case 200: status = "200 OK"
                  case 204: status = "204 No Content"
                  default: status = "404 Not Found"
                  }

                  let header = """
                  HTTP/1.1 \(status)\r
                  Content-Type: application/json\r
                  Access-Control-Allow-Origin: *\r
                  Access-Control-Allow-Methods: GET,POST,OPTIONS\r
                  Access-Control-Allow-Headers: Content-Type\r
                  Content-Length: \(body.count)\r
                  Connection: close\r
                  \r
                  """

                  var out = Data(header.utf8)
                  out.append(body)

                  conn.send(content: out, contentContext: .default, isComplete: true, completion: .contentProcessed { _ in
                      conn.cancel()
                  })
              }
          }
          SWIFT

      - name: Patch AppDelegate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/App/App/AppDelegate.swift")
          s = p.read_text()

          if "EmbeddedSignalingServer.shared.start" in s:
              print("already patched")
          else:
              idx = s.find("didFinishLaunchingWithOptions")
              if idx == -1:
                  raise SystemExit("didFinishLaunchingWithOptions not found")
              ret = s.find("return true", idx)
              if ret == -1:
                  raise SystemExit("return true not found")
              insert = "        try? EmbeddedSignalingServer.shared.start(port: 8081)\n"
              s = s[:ret] + insert + s[ret:]
              p.write_text(s)
          PY

      - name: Patch Info.plist
        run: |
          PLIST=ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'SFOTH uses your local network to host and join multiplayer games.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSBonjourServices" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _sfoth._tcp" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"

      - name: Validate Info.plist
        run: |
          plutil -lint ios/App/App/Info.plist

      - name: Build unsigned app
        env:
          LIB_DIR: ${{ github.workspace }}/sim-libs
        run: |
          set -x
          ls -la "$LIB_DIR"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_LDFLAGS="-L${LIB_DIR} -lSimHost -Wl,-force_load,${LIB_DIR}/libSimHost.a -lz -lc++ -liconv -framework Foundation -framework CoreFoundation -framework Security" \
            -verbose 2>&1 | tee xcodebuild.log

      - name: Show xcodebuild tail on failure
        if: failure()
        run: |
          echo "=== last 200 lines of xcodebuild.log ==="
          tail -200 xcodebuild.log || true

      - name: Inspect App Bundle
        run: |
          echo "=== App Bundle Root ==="
          ls -la build/Build/Products/Release-iphoneos/App.app/
          echo "=== Executable Architecture ==="
          lipo -info build/Build/Products/Release-iphoneos/App.app/App || true
          echo "=== Frameworks (if any) ==="
          ls -la build/Build/Products/Release-iphoneos/App.app/Frameworks 2>/dev/null || echo "No Frameworks folder"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          
          # Create a clean IPA archive bypassing macOS metadata
          ditto -c -k --sequesterRsrc --keepParent Payload SFOTH-unsigned.ipa
          
          echo "=== IPA Structure Check ==="
          unzip -l SFOTH-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SFOTH-unsigned-ipa
          path: SFOTH-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
